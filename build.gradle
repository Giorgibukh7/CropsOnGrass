buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
        classpath 'org.spongepowered:mixingradle:0.4-SNAPSHOT'
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'forge'

final def buildDirectory = project.layout.buildDirectory.get()
final def buildDirectoryAsFile = buildDirectory.asFile
final def processedSourcesDir = buildDirectory.dir('processedSources')
final def toBeProcessed = [
        'de/alphaconqueror/examplemod/util/Constants.java'
]

sourceCompatibility = 1.8
targetCompatibility = 1.8

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    version = mapping_version
    mappings = mapping_channel
}

repositories {
    maven { url 'https://repo.spongepowered.org/maven/' }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    shade("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
    }

    // add your other dependencies here
}

ext.mixinSrg = new File(buildDirectoryAsFile, "resources/main/${mod_id}.mixins.srg")
ext.mixinRefMap = new File(buildDirectoryAsFile, "resources/main/${mod_id}.refmap.json")

compileJava {
    dependsOn 'processModSources'

    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-path',
            '-Xlint:-processing',
            "-AreobfSrgFile=${project.file('build/srgs/mcp-srg.srg').getCanonicalPath()}"
    ]

    if (project.mixinSrg.exists()) {
        options.compilerArgs += "-AoutSrgFile=${project.mixinSrg.getCanonicalPath()}"
    }

    if (project.mixinRefMap.exists()) {
        options.compilerArgs += "-AoutRefMapFile=${project.mixinRefMap.getCanonicalPath()}"
    }

    options.deprecation = true
    options.encoding = 'UTF-8'

    // remove original files from original source
    source = source.filter { file ->
        !toBeProcessed.any { file.absolutePath.endsWith(it.replace('/', File.separator)) }
    }

    // add processed files to source
    source += fileTree(processedSourcesDir)
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-path',
            "-AreobfSrgFile=${tasks.reobf.srg}"
    ]

    options.deprecation = true
    options.encoding = 'utf8'
}

processResources {
    outputs.upToDateWhen { false }

    filesMatching('**/mcmod.info') {
        expand 'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_description': mod_description,
                'minecraft_version': minecraft_version,
                'version': mod_version,
                'mod_authors': mod_authors
    }
}

reobf {
    if (mixinSrg.exists()) {
        addExtraSrgFile mixinSrg
    }

    reobf(shadowJar) { spec ->
        spec.classpath = sourceSets.main.compileClasspath;
    }
}

shadowJar {
    archiveFileName = "${mod_name}-Forge-${minecraft_version}-${mod_version}.jar"
    configurations = [project.configurations.shade]

    // relocate your dependencies here

    exclude 'META-INF/versions/**'
}

artifacts {
    archives shadowJar
}

tasks.register('copySrgs', Copy) {
    dependsOn 'genSrgs'
    // using some FG hacks here
    from plugins.getPlugin("forge").delayedFile("{SRG_DIR}")
    include '**/*.srg'
    into 'build/srgs'
}

tasks.register('processModSources') {
    final def sourceDir = sourceSets.main.java.srcDirs.first()
    final def outputDir = processedSourcesDir.asFile

    doLast {
        outputDir.mkdirs()

        toBeProcessed.each { filePath ->
            final def originalFile = new File(sourceDir, filePath)
            final def outputFile = new File(outputDir, filePath)

            outputFile.parentFile.mkdirs()
            outputFile.text = originalFile.text
                    .replace('@mod_id@', mod_id)
                    .replace('@mod_name@', mod_name)
                    .replace('@version@', mod_version)
        }
    }

    inputs.file(new File('gradle.properties'))
    inputs.files(toBeProcessed.collect { new File(sourceDir, it) })
    outputs.dir(outputDir)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin"           : 'de.alphaconqueror.examplemod.ExampleModPluginCore',
                "TweakClass"              : 'org.spongepowered.asm.launch.MixinTweaker'
        ])
    }
}

setupDecompWorkspace.dependsOn copySrgs
setupDevWorkspace.dependsOn copySrgs
compileJava.dependsOn copySrgs